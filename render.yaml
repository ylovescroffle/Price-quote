services:
  - type: web
    name: cpq-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run init-db
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_PATH
        value: ./database.sqlite
